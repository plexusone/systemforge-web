site_name: SystemForge Web
site_description: React framework for building multi-tenant SaaS applications
site_url: https://plexusone.github.io/systemforge-web/
repo_url: https://github.com/plexusone/systemforge-web
repo_name: plexusone/systemforge-web

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    # Dark mode first (PlexusOne default)
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy

extra_css:
  - https://plexusone.dev/css/plexusone-mkdocs.css

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
  - Guides:
      - Writing an Application: guides/writing-an-application.md
      - Releasing: guides/releasing.md
  - Packages:
      - Overview: packages/index.md
      - '@plexusone/api-client': packages/api-client.md
      - '@plexusone/auth': packages/auth.md
      - '@plexusone/chat': packages/chat.md
      - '@plexusone/design-tokens': packages/design-tokens.md
      - '@plexusone/host': packages/host.md
      - '@plexusone/pages': packages/pages.md
      - '@plexusone/shell': packages/shell.md
      - '@plexusone/telemetry': packages/telemetry.md
      - '@plexusone/tenant': packages/tenant.md
      - '@plexusone/ui': packages/ui.md
  - Architecture:
      - Overview: architecture/overview.md
      - Composing Applications: architecture/composition.md
  - Specs:
      - 'INIT-SYSTEMFORGEWEB-001: Shell Foundations':
          - PRD: specs/initiatives/INIT-SYSTEMFORGEWEB-001/PRD.md
          - TRD: specs/initiatives/INIT-SYSTEMFORGEWEB-001/TRD.md
          - Plan: specs/initiatives/INIT-SYSTEMFORGEWEB-001/PLAN.md
          - Roadmap: specs/initiatives/INIT-SYSTEMFORGEWEB-001/ROADMAP.md
      - Invention:
          - PRD: specs/initiatives/invention/PRD.md
          - TRD: specs/initiatives/invention/TRD.md
          - Plan: specs/initiatives/invention/PLAN.md
          - Tasks: specs/initiatives/invention/TASKS.md
          - ProductGraph:
              - PRD: specs/initiatives/invention/productgraph/PRD.md
              - TRD: specs/initiatives/invention/productgraph/TRD.md
              - Plan: specs/initiatives/invention/productgraph/PLAN.md
              - Tasks: specs/initiatives/invention/productgraph/TASKS.md
  - Releases:
      - Changelog: changelog.md
      - v0.2.3: releases/v0.2.3.md
      - v0.2.2: releases/v0.2.2.md
      - v0.2.1: releases/v0.2.1.md
      - v0.2.0: releases/v0.2.0.md
      - v0.1.0: releases/v0.1.0.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/plexusone/systemforge-web
